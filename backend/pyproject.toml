[project]
name = "dbmon"
version = "0.1.0"
description = "PostgreSQL / Oracle performance monitor"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "oracledb>=2.5",
    "cryptography>=43",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs live demo databases"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
